<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 860" width="620" height="860" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10B981"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366F1"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#EF4444"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="620" height="860" fill="#F8FAFC" rx="12"/>

  <text x="310" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">BTC Prediction Market</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#94A3B8">Canton Network · Firebase · Zoro Wallet</text>

  <!-- USER -->
  <rect x="210" y="68" width="200" height="44" rx="22" fill="#1E293B"/>
  <text x="310" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="white">User</text>
  <text x="310" y="102" text-anchor="middle" font-size="9" fill="#94A3B8">opens app in browser</text>

  <line x1="310" y1="112" x2="310" y2="132" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FIREBASE AUTH -->
  <rect x="185" y="134" width="250" height="48" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="310" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">Firebase Auth</text>
  <text x="310" y="170" text-anchor="middle" font-size="9" fill="#B45309">email/password · Google · GitHub → UUID</text>

  <line x1="310" y1="182" x2="310" y2="202" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LINK PARTY ID -->
  <rect x="200" y="204" width="220" height="44" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="310" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#3730A3">Link Party ID</text>
  <text x="310" y="238" text-anchor="middle" font-size="9" fill="#4338CA">one-time: enter Canton wallet address</text>

  <!-- Branch -->
  <line x1="310" y1="248" x2="310" y2="272" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="80" y1="272" x2="540" y2="272" stroke="#CBD5E1" stroke-width="1.2"/>

  <line x1="80" y1="272" x2="80" y2="292" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="310" y1="272" x2="310" y2="292" stroke="#6366F1" stroke-width="2" marker-end="url(#arr-b)"/>
  <line x1="540" y1="272" x2="540" y2="292" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>

  <text x="80" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#10B981">DEPOSIT</text>
  <text x="310" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#6366F1">BET</text>
  <text x="540" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#EF4444">WITHDRAW</text>

  <!-- LEFT: DEPOSIT -->
  <rect x="24" y="298" width="112" height="38" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="80" y="314" text-anchor="middle" font-size="9.5" font-weight="600" fill="#065F46">Send CBTC</text>
  <text x="80" y="328" text-anchor="middle" font-size="8" fill="#047857">Zoro / Loop wallet</text>

  <line x1="80" y1="336" x2="80" y2="350" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="24" y="352" width="112" height="38" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="80" y="368" text-anchor="middle" font-size="9.5" font-weight="600" fill="#065F46">Pending Queue</text>
  <text x="80" y="382" text-anchor="middle" font-size="8" fill="#047857">auto-approval OFF</text>

  <line x1="80" y1="390" x2="80" y2="404" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="24" y="406" width="112" height="38" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="80" y="422" text-anchor="middle" font-size="9.5" font-weight="600" fill="#065F46">Verify &amp; Accept</text>
  <text x="80" y="436" text-anchor="middle" font-size="8" fill="#047857">match UID → accept</text>

  <line x1="80" y1="444" x2="80" y2="458" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <rect x="20" y="460" width="120" height="32" rx="4" fill="white" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="80" y="473" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6B7280">Canton API</text>
  <text x="80" y="485" text-anchor="middle" font-size="7.5" fill="#9CA3AF">prepare→sign→broadcast</text>

  <line x1="80" y1="492" x2="80" y2="506" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="24" y="508" width="112" height="38" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="80" y="524" text-anchor="middle" font-size="9.5" font-weight="600" fill="#065F46">Credit Balance</text>
  <text x="80" y="538" text-anchor="middle" font-size="8" fill="#047857">+CBTC to user account</text>

  <!-- MIDDLE: BET -->
  <rect x="244" y="298" width="132" height="38" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="310" y="314" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3730A3">Pick UP or DOWN</text>
  <text x="310" y="328" text-anchor="middle" font-size="8" fill="#4338CA">enter CBTC amount</text>

  <line x1="310" y1="336" x2="310" y2="350" stroke="#6366F1" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="244" y="352" width="132" height="38" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="310" y="368" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3730A3">Validate Balance</text>
  <text x="310" y="382" text-anchor="middle" font-size="8" fill="#4338CA">balance &gt;= amount?</text>

  <line x1="310" y1="390" x2="310" y2="404" stroke="#6366F1" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="244" y="406" width="132" height="38" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="310" y="422" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3730A3">Deduct Balance</text>
  <text x="310" y="436" text-anchor="middle" font-size="8" fill="#4338CA">save prediction record</text>

  <line x1="310" y1="444" x2="310" y2="458" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <rect x="244" y="460" width="132" height="32" rx="16" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="310" y="473" text-anchor="middle" font-size="9" fill="#64748B">15-min window</text>
  <text x="310" y="485" text-anchor="middle" font-size="7.5" fill="#94A3B8">countdown...</text>

  <line x1="310" y1="492" x2="310" y2="506" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <rect x="244" y="508" width="132" height="38" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="310" y="524" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400E">Settlement</text>
  <text x="310" y="538" text-anchor="middle" font-size="8" fill="#B45309">pure math, 0 API calls</text>

  <!-- RIGHT: WITHDRAW -->
  <rect x="484" y="298" width="112" height="38" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="540" y="314" text-anchor="middle" font-size="9.5" font-weight="600" fill="#991B1B">Request Withdraw</text>
  <text x="540" y="328" text-anchor="middle" font-size="8" fill="#B91C1C">enter CBTC amount</text>

  <line x1="540" y1="336" x2="540" y2="350" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="484" y="352" width="112" height="38" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="540" y="368" text-anchor="middle" font-size="9.5" font-weight="600" fill="#991B1B">Validate Balance</text>
  <text x="540" y="382" text-anchor="middle" font-size="8" fill="#B91C1C">balance &gt;= amount?</text>

  <line x1="540" y1="390" x2="540" y2="404" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="480" y="406" width="120" height="32" rx="4" fill="white" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="540" y="419" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6B7280">Canton API</text>
  <text x="540" y="431" text-anchor="middle" font-size="7.5" fill="#9CA3AF">prepare→sign→broadcast</text>

  <line x1="540" y1="438" x2="540" y2="452" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="484" y="454" width="112" height="38" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="540" y="470" text-anchor="middle" font-size="9.5" font-weight="600" fill="#991B1B">Deduct Balance</text>
  <text x="540" y="484" text-anchor="middle" font-size="8" fill="#B91C1C">CBTC sent to wallet</text>

  <!-- CONVERGE TO LEDGER -->
  <line x1="80" y1="546" x2="80" y2="618" stroke="#10B981" stroke-width="1.5"/>
  <line x1="80" y1="618" x2="248" y2="638" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <line x1="310" y1="546" x2="310" y2="636" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <line x1="540" y1="492" x2="540" y2="618" stroke="#EF4444" stroke-width="1.5"/>
  <line x1="540" y1="618" x2="372" y2="638" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <!-- INTERNAL LEDGER -->
  <rect x="168" y="640" width="284" height="56" rx="10" fill="#4F46E5" stroke="#3730A3" stroke-width="2"/>
  <text x="310" y="662" text-anchor="middle" font-size="13" font-weight="700" fill="white">Internal Ledger</text>
  <text x="310" y="678" text-anchor="middle" font-size="9" fill="#C7D2FE">Firestore · balances · rounds · predictions</text>
  <text x="310" y="690" text-anchor="middle" font-size="8" fill="#A5B4FC">atomic transactions · idempotency via contract_id</text>

  <!-- LEGEND -->
  <rect x="168" y="714" width="284" height="100" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="310" y="732" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Legend</text>

  <line x1="188" y1="748" x2="218" y2="748" stroke="#10B981" stroke-width="2.5"/>
  <text x="224" y="752" font-size="9" fill="#374151">Deposit flow</text>

  <line x1="308" y1="748" x2="338" y2="748" stroke="#6366F1" stroke-width="2.5"/>
  <text x="344" y="752" font-size="9" fill="#374151">Bet flow</text>

  <line x1="188" y1="768" x2="218" y2="768" stroke="#EF4444" stroke-width="2.5"/>
  <text x="224" y="772" font-size="9" fill="#374151">Withdraw flow</text>

  <line x1="308" y1="768" x2="338" y2="768" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="344" y="772" font-size="9" fill="#374151">Settlement</text>

  <rect x="188" y="782" width="50" height="14" rx="3" fill="white" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="213" y="793" text-anchor="middle" font-size="8" fill="#6B7280">Canton API</text>
  <text x="244" y="793" font-size="9" fill="#374151">= on-chain call</text>

  <rect x="318" y="782" width="50" height="14" rx="3" fill="#4F46E5"/>
  <text x="343" y="793" text-anchor="middle" font-size="8" fill="white">Ledger</text>
  <text x="374" y="793" font-size="9" fill="#374151">= internal only</text>

  <text x="610" y="854" text-anchor="end" font-size="7" fill="#CBD5E1">v1.1</text>

</svg>
